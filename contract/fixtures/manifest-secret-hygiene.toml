contract_version = "0.1"
name = "secret-hygiene"
code = "SEC"
version = "0.1.0"
kind = "batch"
language = "go"
description = "Secrets in dotfiles and shell history; credential-file modes and SSH keys"
status_command = ["sec", "status", "--json"]
console_route = "/sec"
ocsf_classes = [2006, 2003]

# A described read is also the gateway's MCP tool `sec.findings`.
[read_commands.findings]
argv = ["sec", "list", "--all", "--json"]
description = "Every secret-hygiene finding, open and known: rule, file kind, severity and state, never the secret"

# Commands: declared here, passed through and audited by the gateway.
[commands.allow]
tier = "confirm"
description = "Mark a finding as known, with a reason"
argv = ["sec", "allow", "--reason", "{reason}", "{fingerprint}"]
inverse = "unallow"

[commands.allow.params.fingerprint]
pattern = "^sec-[0-9a-f]{32}$"

[commands.allow.params.reason]
# One line of printable text that cannot be read as an option.
pattern = '^[^-\x00-\x1f\x7f][^\x00-\x1f\x7f]{0,199}$'
description = "Why the finding is known"

[commands.unallow]
tier = "safe"
description = "Report a known finding again"
argv = ["sec", "unallow", "{fingerprint}"]

[commands.unallow.params.fingerprint]
pattern = "^sec-[0-9a-f]{32}$"
