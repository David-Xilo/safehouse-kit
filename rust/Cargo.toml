[package]
name = "safehouse-core"
description = "safehouse shared core for Rust modules: OCSF envelope, IDs, JSONL, redaction, contract status types and schemas, the local-model client, the write token"
version = "0.10.1"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
publish = false

# Used as a cargo git dependency pinned by tag: the crate reads `../contract/`
# with include_str!, which a git checkout has and a crates.io package would not.

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std", "serde"] }
rustix = { version = "1.1.5", default-features = false, features = ["std", "system"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_repr = "0.1.21"
thiserror = "2.0.21"
uuid = { version = "1.26.1", features = ["v5", "v7"] }
# `openapi`: utoipa schemas for the envelope and status types.
utoipa = { version = "6.0.0", optional = true, features = ["chrono", "repr"] }
# `redact`: the rule loader over contract/rules/.
aho-corasick = { version = "1.1.5", optional = true }
regex = { version = "1.13.1", optional = true }
toml = { version = "1.1.6", optional = true }
# `schema`: validation against contract/schemas/.
jsonschema = { version = "0.58.1", default-features = false, optional = true }
# `local-model`: the Ollama client, with jsonschema and toml.
# No TLS: the client speaks plain HTTP to a loopback Ollama only.
ureq = { version = "3.4.2", default-features = false, optional = true }
# `write-token`: the token file, the Bearer check and the session cookie.
hmac = { version = "0.13.0", optional = true }
sha2 = { version = "0.11.1", optional = true }
subtle = { version = "2.6.1", optional = true }

[features]
openapi = ["dep:utoipa"]
redact = ["dep:aho-corasick", "dep:regex", "dep:toml"]
schema = ["dep:jsonschema"]
local-model = ["dep:jsonschema", "dep:toml", "dep:ureq"]
write-token = ["dep:hmac", "dep:sha2", "dep:subtle", "rustix/fs", "rustix/process"]

[dev-dependencies]
toml = "1.1.6"

[lints.rust]
unsafe_code = "forbid"

[[test]]
name = "redact"
required-features = ["redact"]

[[test]]
name = "redact_memory"
required-features = ["redact"]

[[test]]
name = "contract"
required-features = ["schema"]

[[test]]
name = "local"
required-features = ["local-model"]

[[test]]
name = "token"
required-features = ["write-token"]
